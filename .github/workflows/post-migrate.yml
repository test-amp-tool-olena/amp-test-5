name: Post-Migration
run-name: "Post-Migration → #${{ github.event.issue.number }} ${{ github.event.issue.title }}"

on:
  issues:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post-migrate:
    if: github.event.label.name == 'status:migrate-success'
    runs-on: ${{ fromJSON(vars.AMP_RUNNER_POST_MIGRATE || vars.AMP_RUNNER || '"ubuntu-latest"') }}

    steps:
      # Mint App tokens for control-repo access. AMP App is the dedicated
      # control-repo credential; primary App is back-compat fallback.
      - name: Mint AMP App token (best-effort)
        id: amp-app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.AMP_APP_ID }}
          private-key: ${{ secrets.AMP_APP_PRIVATE_KEY }}

      - name: Mint primary App token (best-effort)
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.amp-app-token.outputs.token || steps.app-token.outputs.token || secrets.GH_AMP_PAT || secrets.GH_DEST_PAT }}

      - name: Setup AMP
        uses: ./.github/actions/setup-amp
        with:
          dist-token: ${{ secrets.AMP_DIST_TOKEN }}
          version:    ${{ vars.AMP_VERSION }}
          dist-repo:  ${{ vars.AMP_DIST_REPO }}

      - name: "Upsert teams (no-op if no dst-team label)"
        run: |
          python3 -m amp.commands \
            --command upsert-teams \
            --issue-number ${{ github.event.issue.number }} \
            --repo ${{ github.repository }}
        env:
          GH_AMP_PAT: ${{ secrets.GH_AMP_PAT }}
          GH_AMP_API_URL: ${{ vars.GH_AMP_API_URL }}
          AMP_APP_ID: ${{ secrets.AMP_APP_ID }}
          AMP_APP_PRIVATE_KEY: ${{ secrets.AMP_APP_PRIVATE_KEY }}
          GH_DEST_PAT: ${{ secrets.GH_DEST_PAT }}
          GH_DEST_API_URL: ${{ vars.GH_DEST_API_URL }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          DEST_APP_ID: ${{ secrets.DEST_APP_ID }}
          DEST_APP_PRIVATE_KEY: ${{ secrets.DEST_APP_PRIVATE_KEY }}
        # TODO(SCIM/EMU): when team_management=scim, upsert-teams should refuse
        # to create teams and apply `status:waiting-on-scim-team` if the team
        # doesn't already exist. Membership is IdP-managed; only the repo↔team
        # association is API-writable in that mode.

      - name: Post ADO-specific post-migration hints
        if: contains(github.event.issue.labels.*.name, 'provider:ado')
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          token: ${{ steps.amp-app-token.outputs.token || steps.app-token.outputs.token || secrets.GH_AMP_PAT || secrets.GH_DEST_PAT }}
          body: |
            ## ADO post-migration

            - [ ] Configure autolink references (`/configure-autolink`)
            - [ ] Rewire pipelines (if applicable)
