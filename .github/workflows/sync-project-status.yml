name: Sync Project Status (sweeper)
run-name: "Sync project sweeper${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}"

# Drift sweeper. AMP's CLI now syncs the project board inline whenever it
# changes a status:* label (see set_status_label in amp/labels.py), so this
# workflow no longer fires per label event — the old `issues:labeled` trigger
# was costing ~1,300 runner-minutes/day from cancelled-runner billing (each
# `amp analyze` applied ~8 labels in <1s, allocating ~8 runners that each
# billed a minimum 1 rounded-up minute even though cancel-in-progress killed
# all but the last one).
#
# The cron runs hourly during US-Eastern business hours (M-F) and
# reconciles any drift between issue labels and the project Status/Age
# fields. Its only real job is catching label edits made directly through
# the GitHub UI (or any other path that bypasses the amp CLI). Operators
# can run it off-hours via workflow_dispatch.
#
# Cron `0 10-23 * * 1-5` is UTC (GHA only schedules in UTC). It covers
# ~6:00 a.m. – 7:00 p.m. ET in EDT and ~5:00 a.m. – 6:00 p.m. ET in EST.
# No DST handling, no overnight, no weekends — by design.
on:
  schedule:
    - cron: "0 10-23 * * 1-5"
  workflow_dispatch:

# Prevent overlapping sweeps. If a sweep is still running when the next cron
# tick fires, queue the new one rather than cancel — a half-finished sweep
# leaves some issues unreconciled until the *next* tick, but the cancelled
# run still bills a minute.
concurrency:
  group: sync-project-sweep
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  issues: read
  contents: read

jobs:
  sweep:
    if: ${{ vars.AMP_PROJECT_OWNER != '' && vars.AMP_PROJECT_NUMBER != '' }}
    runs-on: ${{ fromJSON(vars.AMP_RUNNER_SYNC_PROJECT || vars.AMP_RUNNER || '"ubuntu-latest"') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Control-repo checkout uses GH_AMP_PAT (the AMP-tenant credential).
          # Back-compat: GH_DEST_PAT when the control repo lives on dest tenant.
          token: ${{ secrets.GH_AMP_PAT || secrets.GH_DEST_PAT }}

      - name: Setup AMP
        uses: ./.github/actions/setup-amp
        with:
          dist-token: ${{ secrets.AMP_DIST_TOKEN }}
          version:    ${{ vars.AMP_VERSION }}
          dist-repo:  ${{ vars.AMP_DIST_REPO }}

      - name: Sweep project status
        # Issue reads route through GH_AMP_* (control-repo tenant); the
        # GraphQL project mutation routes through GH_DEST_* (Projects v2
        # lives on the destination tenant).
        run: |
          amp --verbose backfill-project-status \
            --repo ${{ github.repository }} \
            --owner "${{ vars.AMP_PROJECT_OWNER }}" \
            --number ${{ vars.AMP_PROJECT_NUMBER }}
        env:
          GH_AMP_PAT: ${{ secrets.GH_AMP_PAT }}
          GH_AMP_API_URL: ${{ vars.GH_AMP_API_URL }}
          AMP_APP_ID: ${{ secrets.AMP_APP_ID }}
          AMP_APP_PRIVATE_KEY: ${{ secrets.AMP_APP_PRIVATE_KEY }}
          GH_DEST_PAT: ${{ secrets.GH_DEST_PAT }}
          GH_DEST_API_URL: ${{ vars.GH_DEST_API_URL }}
