name: Daily Report
run-name: "Daily Report ${{ inputs.date || 'today' }}"

on:
  schedule:
    - cron: "0 18 * * 1-5"  # 6pm UTC weekdays
  workflow_dispatch:
    inputs:
      date:
        description: "Date to report on (YYYY-MM-DD, default today)"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  report:
    runs-on: ${{ fromJSON(vars.AMP_RUNNER_DAILY_REPORT || vars.AMP_RUNNER || '"ubuntu-latest"') }}

    steps:
      # Mint App tokens for control-repo access. AMP App is the dedicated
      # control-repo credential; primary App is back-compat fallback.
      - name: Mint AMP App token (best-effort)
        id: amp-app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.AMP_APP_ID }}
          private-key: ${{ secrets.AMP_APP_PRIVATE_KEY }}

      - name: Mint primary App token (best-effort)
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.amp-app-token.outputs.token || steps.app-token.outputs.token || secrets.GH_AMP_PAT || secrets.GH_DEST_PAT }}

      - name: Setup AMP
        uses: ./.github/actions/setup-amp
        with:
          dist-token: ${{ secrets.AMP_DIST_TOKEN }}
          version:    ${{ vars.AMP_VERSION }}
          dist-repo:  ${{ vars.AMP_DIST_REPO }}

      - name: Generate report and post Discussion
        run: |
          amp daily \
            --repo ${{ github.repository }} \
            ${{ inputs.date && format('--date "{0}"', inputs.date) || '' }} \
            --format md \
            --output report.md \
            --discussion
        env:
          GH_AMP_PAT: ${{ secrets.GH_AMP_PAT }}
          GH_AMP_API_URL: ${{ vars.GH_AMP_API_URL }}
          AMP_APP_ID: ${{ secrets.AMP_APP_ID }}
          AMP_APP_PRIVATE_KEY: ${{ secrets.AMP_APP_PRIVATE_KEY }}
          GH_DEST_PAT: ${{ secrets.GH_DEST_PAT }}
          GH_DEST_API_URL: ${{ vars.GH_DEST_API_URL }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          DEST_APP_ID: ${{ secrets.DEST_APP_ID }}
          DEST_APP_PRIVATE_KEY: ${{ secrets.DEST_APP_PRIVATE_KEY }}

      - name: Upload report artifact
        if: always() && hashFiles('report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: report.md
          retention-days: 90
