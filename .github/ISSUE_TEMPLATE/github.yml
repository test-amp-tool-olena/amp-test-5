name: GitHub Migration
description: Migrate a repo from one GitHub instance/org to another
labels: ["provider:github"]
body:
  - type: input
    id: source_org
    attributes:
      label: Source Org
      description: Source GitHub organization
      placeholder: ts-source
    validations:
      required: true
  - type: input
    id: source_repo
    attributes:
      label: Source Repo
      description: Repository name
    validations:
      required: true
  - type: input
    id: target_org
    attributes:
      label: Target Org
      description: Destination GitHub organization
      placeholder: ts-dest
    validations:
      required: true
  - type: input
    id: target_repo
    attributes:
      label: Target Repo
      description: Destination repository name (defaults to source name)
  - type: markdown
    attributes:
      value: |
        ## Available Commands
        - `/dryrun` — Dry run migration to sandbox
        - `/migrate` — Production migration
        - `/remigrate` — Delete target and re-migrate
        - `/archive` — Archive source repo
        - `/create-team --name <team>` — Create team and assign repo
        - `/set-properties --props '{"key":"val"}'` — Set custom properties
        - `/reclaim-mannequins` — Remap mannequin users
        - `/update-issue` — Re-run analysis
