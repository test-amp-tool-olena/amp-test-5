name: Azure DevOps Migration
description: Migrate a repo from Azure DevOps to GitHub
labels: ["provider:ado"]
body:
  - type: input
    id: source_org
    attributes:
      label: Source Org
      description: Azure DevOps organization name
      placeholder: rschwarz0884
    validations:
      required: true
  - type: input
    id: team_project
    attributes:
      label: Team Project
      description: Azure DevOps team project
      placeholder: issue-ops-testing
    validations:
      required: true
  - type: input
    id: source_repo
    attributes:
      label: Source Repo
      description: Repository name in Azure DevOps
    validations:
      required: true
  - type: input
    id: target_org
    attributes:
      label: Target Org
      description: Destination GitHub organization
      placeholder: ts-dest
    validations:
      required: true
  - type: input
    id: target_repo
    attributes:
      label: Target Repo
      description: Destination repository name (defaults to source name)
  - type: markdown
    attributes:
      value: |
        ## Available Commands
        - `/dryrun` — Dry run migration to sandbox
        - `/migrate` — Production migration
        - `/remigrate` — Delete target and re-migrate
        - `/archive` — Lock/disable source repo
        - `/create-team --name <team>` — Create team and assign repo
        - `/set-properties --props '{"key":"val"}'` — Set custom properties
        - `/configure-autolink` — Set up autolink references
        - `/reclaim-mannequins` — Remap mannequin users
        - `/update-issue` — Re-run analysis
