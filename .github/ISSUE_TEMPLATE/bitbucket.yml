name: Bitbucket Server Migration
description: Migrate a repo from Bitbucket Server to GitHub
labels: ["provider:bitbucket"]
body:
  - type: input
    id: source_org
    attributes:
      label: Source Organization
      description: Bitbucket Server project key
    validations:
      required: true
  - type: input
    id: source_repo
    attributes:
      label: Source Repo
      description: Repository slug in Bitbucket
    validations:
      required: true
  - type: input
    id: target_org
    attributes:
      label: Target Org
      description: Destination GitHub organization
    validations:
      required: true
  - type: input
    id: target_repo
    attributes:
      label: Target Repo
      description: Destination repository name (defaults to source name)
  - type: markdown
    attributes:
      value: |
        ## Available Commands
        - `/dryrun` — Dry run migration to sandbox
        - `/migrate` — Production migration
        - `/remigrate` — Delete target and re-migrate
        - `/archive` — Lock source repo
        - `/update-issue` — Re-run analysis
