# Project v2 view template for `amp install`.
#
# Refresh this file from the canonical reference project with:
#   amp export-project-views --owner migration-sandbox --number 1 \
#       --output config/project_views.yml
#
# Limitation: group_by is not settable via API (no createProjectV2View
# GraphQL mutation as of May 2026, and the REST endpoint does not accept
# group_by). After install, set group_by per-view in the UI:
#   <view> -> ... -> Group by -> <field>
#
# Note: the reference project has two views literally named "By Status"
# (one table, one board). `apply_views_template` dedupes by name, so the
# board variant is renamed to "By Status (Board)" here. Rename in the
# UI after install if exact parity with the reference is required.
views:
- name: By Status
  layout: table
  filter: ''
  visible_fields:
  - Title
  - Status
  - Age
- name: By Age
  layout: table
  filter: ''
  visible_fields:
  - Title
  - Status
  - Labels
- name: By Status (Board)
  layout: board
  filter: ''
  visible_fields:
  - Title
  - Assignees
  - Status
  - Linked pull requests
  - Sub-issues progress
  - Age
  - LFS
  - Submodules
- name: By Size
  layout: board
  filter: -status:Migrate,Analyzing,"Dry Run"
  visible_fields:
  - Title
  - Assignees
  - Status
  - Linked pull requests
  - Sub-issues progress
- name: LFS
  layout: table
  filter: ''
  visible_fields:
  - Title
  - Status
- name: Blockers
  layout: board
  filter: ''
  visible_fields:
  - Title
  - Assignees
  - Linked pull requests
  - Sub-issues progress
  - Size
- name: By SCM
  layout: board
  filter: ''
  visible_fields:
  - Title
  - Assignees
  - Status
  - Linked pull requests
  - Sub-issues progress
- name: StatusByTeam
  layout: board
  filter: -status:Analyzing,Analyzed,"Dry Run","Dry Run Failed",Migrate
  visible_fields:
  - Title
  - Assignees
  - Status
  - Linked pull requests
  - Sub-issues progress
