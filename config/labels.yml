# Label taxonomy for Agentic Migrations
# Run: amp setup-labels --repo <owner/repo>

providers:
  - name: "provider:ado"
    color: "0078D4"
    description: "Source: Azure DevOps"
  - name: "provider:bitbucket"
    color: "2684FF"
    description: "Source: Bitbucket Server"
  - name: "provider:bitbucket-cloud"
    color: "205081"
    description: "Source: Bitbucket Cloud"
  - name: "provider:github"
    color: "333333"
    description: "Source: GitHub"
  - name: "provider:gitlab"
    color: "FC6D26"
    description: "Source: GitLab"

size:
  - name: "size:small"
    color: "C2E0C6"
    description: "Repo < 100MB"
  - name: "size:medium"
    color: "FEF2C0"
    description: "Repo 100MB - 1GB"
  - name: "size:large"
    color: "F9D0C4"
    description: "Repo 1GB - 5GB"
  - name: "size:huge"
    color: "E99695"
    description: "Repo > 5GB"

prs:
  - name: "prs:small"
    color: "C2E0C6"
    description: "0-100 pull requests"
  - name: "prs:medium"
    color: "FEF2C0"
    description: "101-500 pull requests"
  - name: "prs:large"
    color: "F9D0C4"
    description: "501-5000 pull requests"
  - name: "prs:xlarge"
    color: "E99695"
    description: "5000+ pull requests"

blob:
  - name: "blob:ok"
    color: "C2E0C6"
    description: "No large blob issues"
  - name: "blob:warning"
    color: "FEF2C0"
    description: "Blobs > 100MB detected"
  - name: "blob:error"
    color: "B60205"
    description: "Blobs > 375MB - migration blocker"

lfs:
  - name: "lfs:active"
    color: "B60205"
    description: "LFS currently in use and healthy"
  - name: "lfs:historical"
    color: "FEF2C0"
    description: "LFS was configured but no longer active"
  - name: "lfs:broken"
    color: "B60205"
    description: "LFS pointers exist but objects missing/corrupt"
  - name: "lfs:oversized"
    color: "E99695"
    description: "Files should be LFS-tracked but aren't"
  - name: "lfs:none"
    color: "0E8A16"
    description: "No LFS involvement ever"
  - name: "lfs:orphan-pointers"
    color: "E99695"
    description: "LFS pointers for paths no .gitattributes rule covers; a later edit can re-store the file raw"
  - name: "lfs:inconsistent"
    color: "E99695"
    description: "Same path is an LFS pointer on some refs and a raw blob on others; split LFS state across refs"
  - name: "lfs:attributes-invalid"
    color: "E99695"
    description: ".gitattributes LFS rule is malformed (e.g. brace expansion {*.tgz}) and silently does nothing"
  - name: "lfs:large"
    color: "E99695"
    description: "LFS payload >AMP_LFS_LARGE_THRESHOLD_BYTES (5 GiB default); routes to MIGRATION_WORKER_LARGE runner"
  - name: "lfs:dest-missing"
    color: "B60205"
    description: "Destination LFS missing source objects after push (git lfs push exit 0 but Batch API confirms gap)"
  - name: "lfs:source-missing"
    color: "B60205"
    description: "Source LFS server cannot serve referenced OIDs; data-loss risk, flagged by analyze or verify"
  - name: "lfs:dest-auth"
    color: "B60205"
    description: "Destination LFS rejected PAT/App (HTTP 401/403) on upload probe — verify Contents: write scope"
  - name: "lfs:dest-saml"
    color: "B60205"
    description: "Destination org is SAML-gated and the PAT is not authorized — re-authorize the PAT for that org"
  - name: "lfs:dest-quota"
    color: "B60205"
    description: "Destination LFS quota exceeded (HTTP 507 / insufficient_storage) — contact admin to raise org quota"

attributes:
  - name: "submodules"
    color: "D4C5F9"
    description: "Repo has git submodules"
  - name: "submodules:rewrite-needed"
    color: "F9D0C4"
    description: "≥1 submodule URL points at the source SCM host and will need updating post-migration"
  - name: "webhooks"
    color: "D4C5F9"
    description: "Repo has active webhooks"
  - name: "actions:rewrite-needed"
    color: "F9D0C4"
    description: ".github/workflows references reusable workflows/actions in source-org repos that need path rewriting"
  - name: "actions:ok"
    color: "C2E0C6"
    description: ".github/workflows present; no cross-org uses: references found"
  - name: "actions:none"
    color: "EDEDED"
    description: "No .github/workflows directory"
  - name: "codeowners:rewrite-needed"
    color: "F9D0C4"
    description: "CODEOWNERS contains @org/team mentions that may not resolve on the destination"
  - name: "codeowners:none"
    color: "EDEDED"
    description: "No CODEOWNERS file (or empty/no team mentions)"
  - name: "secrets:present"
    color: "FEF2C0"
    description: "Workflow files reference secrets/vars/environments — these do NOT migrate"
  - name: "hardcoded-urls:present"
    color: "FEF2C0"
    description: "Tracked files contain hardcoded references to the source SCM host"
  - name: "branch-protection:present"
    color: "D4C5F9"
    description: "Source has classic branch protection rules; AMP recreates them on /dryrun and /migrate"
  - name: "branch-protection:dest-applied"
    color: "0E8A16"
    description: "All classic branch protection rules recreated at the destination"
  - name: "branch-protection:dest-partial"
    color: "FBCA04"
    description: "Some branch protection rules were applied at the destination, others were skipped or failed"
  - name: "branch-protection:dest-failed"
    color: "B60205"
    description: "No branch protection rules applied at destination (permissions/API error); migration still succeeded"
  - name: "branch-protection:dest-skipped"
    color: "EDEDED"
    description: "Branch protection recreate skipped (no matching branches, or source rules unavailable)"
  - name: "custom-properties:present"
    color: "D4C5F9"
    description: "Source repo has custom repository properties set (carried through on /migrate)"
  - name: "ref:long"
    color: "E99695"
    description: "Ref names exceeding GitHub limits"
  - name: "ref:invalid-chars"
    color: "E99695"
    description: "Ref names containing characters rejected by git check-ref-format"
  - name: "ref:case-collision"
    color: "E99695"
    description: "Ref names differing only by case (break on case-sensitive filesystems)"
  - name: "ref:path-conflict"
    color: "E99695"
    description: "Ref names where a parent ref collides with a child path"

volume:
  - name: "refs:high"
    color: "F9D0C4"
    description: "More than 5000 branches - metadata import may time out"
  - name: "tags:high"
    color: "F9D0C4"
    description: "More than 5000 tags - metadata import may time out"
  - name: "commits:huge"
    color: "E99695"
    description: "More than 250k commits - archive generation may exceed export window"
  - name: "releases:oversized"
    color: "E99695"
    description: "Releases exceed 30 GB - likely to hit GEI's 40 GB metadata-archive cap; consider cfg:skip-releases"
  - name: "meta:oversized"
    color: "B60205"
    description: "Metadata archive exceeded 40 GB cap during migration - retry with cfg:skip-releases"

age:
  - name: "age:<1mo"
    color: "C2E0C6"
    description: "Last commit < 1 month ago"
  - name: "age:1-6mo"
    color: "FEF2C0"
    description: "Last commit 1-6 months ago"
  - name: "age:6-12mo"
    color: "F9D0C4"
    description: "Last commit 6-12 months ago"
  - name: "age:>1yr"
    color: "E99695"
    description: "Last commit > 1 year ago"
  - name: "stale"
    color: "EDEDED"
    description: "No commits in > 1 year"

duration:
  - name: "duration:0-5m"
    color: "C2E0C6"
    description: "GEI run took 0-5 minutes"
  - name: "duration:5-10m"
    color: "C2E0C6"
    description: "GEI run took 5-10 minutes"
  - name: "duration:10-15m"
    color: "FEF2C0"
    description: "GEI run took 10-15 minutes"
  - name: "duration:15-20m"
    color: "FEF2C0"
    description: "GEI run took 15-20 minutes"
  - name: "duration:20-25m"
    color: "FEF2C0"
    description: "GEI run took 20-25 minutes"
  - name: "duration:25-30m"
    color: "FEF2C0"
    description: "GEI run took 25-30 minutes"
  - name: "duration:30-35m"
    color: "F9D0C4"
    description: "GEI run took 30-35 minutes"
  - name: "duration:35-40m"
    color: "F9D0C4"
    description: "GEI run took 35-40 minutes"
  - name: "duration:40-45m"
    color: "F9D0C4"
    description: "GEI run took 40-45 minutes"
  - name: "duration:45-50m"
    color: "E99695"
    description: "GEI run took 45-50 minutes"
  - name: "duration:50-55m"
    color: "E99695"
    description: "GEI run took 50-55 minutes"
  - name: "duration:55-60m"
    color: "E99695"
    description: "GEI run took 55-60 minutes"
  - name: "duration:60m+"
    color: "B60205"
    description: "GEI run exceeded 60 minutes (near kill-timer)"

status:
  - name: "status:analyzed"
    color: "0075CA"
    description: "Repo analyzed, ready for action"
  - name: "status:analyzing"
    color: "FBCA04"
    description: "Analysis in progress"
  - name: "status:analysis-failed"
    color: "B60205"
    description: "Analysis failed (e.g. clone refused) — fix and re-run analyze"
  - name: "status:dryrun-queued"
    color: "D4C5F9"
    description: "Dry run queued"
  - name: "status:dryrun-running"
    color: "FBCA04"
    description: "Dry run in progress"
  - name: "status:dryrun-success"
    color: "0E8A16"
    description: "Dry run completed successfully"
  - name: "status:dryrun-failed"
    color: "B60205"
    description: "Dry run failed"
  - name: "status:migrate-queued"
    color: "D4C5F9"
    description: "Migration queued"
  - name: "status:migrate-running"
    color: "FBCA04"
    description: "Migration in progress"
  - name: "status:migrate-success"
    color: "0E8A16"
    description: "Migration completed successfully"
  - name: "status:migrate-failed"
    color: "B60205"
    description: "Migration failed"
  - name: "status:has-warnings"
    color: "FBCA04"
    description: "Last /dryrun or /migrate completed but GEI reported warnings — see the issue comment"
  - name: "status:repairing"
    color: "FBCA04"
    description: "Auto-repair in progress"
  - name: "status:archiving"
    color: "FBCA04"
    description: "Archiving in progress"
  - name: "status:archived"
    color: "EDEDED"
    description: "Source repo archived"
  - name: "status:obsolete"
    color: "6F42C1"
    description: "Source repo no longer exists; flagged by refresh"
  - name: "status:duplicate-candidate"
    color: "B60205"
    description: "Multiple issues match the same source repo; needs human review"
  - name: "status:empty"
    color: "EDEDED"
    description: "Source repo has no commits / no default branch — migration not applicable"

commands:
  - name: "cmd:dryrun"
    color: "5319E7"
    description: "Trigger dry run migration"
  - name: "cmd:migrate"
    color: "5319E7"
    description: "Trigger production migration"
  - name: "cmd:migrate-with-submodules"
    color: "5319E7"
    description: "Trigger production migration of this repo and queue cmd:migrate on each AMP-managed direct submodule"
  - name: "cmd:migrate-submodules-deep"
    color: "5319E7"
    description: "Trigger production migration of this repo and the full recursive submodule tree (all descendants)"
  - name: "cmd:remigrate"
    color: "5319E7"
    description: "Delete target and re-migrate"
  - name: "cmd:archive"
    color: "5319E7"
    description: "Archive/lock source repo"
  - name: "cmd:unarchive"
    color: "5319E7"
    description: "Reverse archive: unlock source repo"
  - name: "cmd:set-properties"
    color: "5319E7"
    description: "Set custom properties on target"
  - name: "cmd:update-issue"
    color: "5319E7"
    description: "Re-run analysis and refresh issue"
  - name: "cmd:upsert-teams"
    color: "5319E7"
    description: "(Post-migrate) Upsert dst-team:* read/write/admin teams and attach repo at destination (idempotent)"
  - name: "cmd:upsert-secrets"
    color: "5319E7"
    description: "Post-migrate: upsert placeholder stubs for workflow secrets/variables at destination (idempotent)"
  - name: "cmd:upsert-envs"
    color: "5319E7"
    description: "(Post-migrate) Upsert source-side Actions environments at destination (idempotent)"
  - name: "cmd:upsert-protection"
    color: "5319E7"
    description: "(Post-migrate) Upsert source classic branch protection rules at destination (idempotent)"
  - name: "cmd:upsert-properties"
    color: "5319E7"
    description: "(Post-migrate) Upsert source custom properties at destination (idempotent)"
  - name: "cmd:upsert-fixes"
    color: "5319E7"
    description: "(Post-migrate) Re-push amp/migration-fixes branch (submodule / actions / codeowners rewrites)"
  - name: "cmd:upsert-validate"
    color: "5319E7"
    description: "(Post-migrate) Re-run branch/tag/commit count validation against destination"
  - name: "cmd-pending:remigrate"
    color: "C5DEF5"
    description: "Internal: dispatcher should run /remigrate (not /migrate) when claiming this issue"

config:
  - name: "cfg:skip-releases"
    color: "C5DEF5"
    description: "Pass --skip-releases to gh gei (avoid 40 GB metadata-archive cap from bulky release binaries)"

ai:
  - name: "cp-repair-available"
    color: "FBCA04"
    description: "AI repair proposal available for review"
  - name: "cp-repair-applied"
    color: "0E8A16"
    description: "AI repair auto-applied, ready for retry"

migration_fixes:
  - name: "migration-fixes:none"
    color: "EDEDED"
    description: "Post-migration fixes: no rewrites needed"
  - name: "migration-fixes:pushed"
    color: "0E8A16"
    description: "Post-migration fixes: amp/migration-fixes branch pushed to destination"
  - name: "migration-fixes:failed"
    color: "B60205"
    description: "Post-migration fixes: branch push failed — see issue comment"

custom_properties:
  - name: "custom-properties:applied"
    color: "0E8A16"
    description: "Custom properties values applied on destination repo"
  - name: "custom-properties:created+applied"
    color: "0E8A16"
    description: "Custom property schemas created at destination org level, then values applied on the repo"
  - name: "custom-properties:dest-not-set"
    color: "FBCA04"
    description: "Custom properties not applied at destination (permissions/schema); migration still succeeded"

status_validate:
  - name: "status:validate-passed"
    color: "0E8A16"
    description: "Post-migration source-vs-destination comparison passed"
  - name: "status:validate-failed"
    color: "B60205"
    description: "Post-migration source-vs-destination comparison found a mismatch — see issue comment"
  - name: "status:validate-history-rewritten"
    color: "C5DEF5"
    description: "History rewrite (e.g. LFS conversion) makes SHA comparison non-applicable; non-SHA checks still run"

secrets_recreate:
  - name: "secrets-recreate:none"
    color: "EDEDED"
    description: "No repo/env secrets or variables to recreate at destination"
  - name: "secrets-recreate:created"
    color: "0E8A16"
    description: "All repo/env secret + variable stubs created at destination (placeholders; owner fills values)"
  - name: "secrets-recreate:partial"
    color: "FBCA04"
    description: "Some secret/variable stubs created; others skipped (already existed) or failed — see issue comment"
  - name: "secrets-recreate:failed"
    color: "B60205"
    description: "Could not create secret/variable stubs at destination (permissions/auth) — see issue comment"
  - name: "secrets-recreate:skipped"
    color: "C5DEF5"
    description: "All secrets/variables already existed at destination — nothing created (idempotent)"
  - name: "secrets-recreate:rate-limit-deferred"
    color: "FBCA04"
    description: "GitHub API rate-limit too low to safely create stubs; re-trigger via cmd:upsert-secrets later"

environments:
  - name: "environments:source-present"
    color: "C5DEF5"
    description: "Source repo has GitHub Actions Environments — recreated at destination on /dryrun and /migrate"
  - name: "environments:source-none"
    color: "EDEDED"
    description: "Source repo has no GitHub Actions Environments"
  - name: "environments:none"
    color: "EDEDED"
    description: "No environments to recreate at destination"
  - name: "environments:created"
    color: "0E8A16"
    description: "All environments + branch policies created at destination (reviewers stripped if unresolvable)"
  - name: "environments:partial"
    color: "FBCA04"
    description: "Some environments created; others skipped (already existed) or failed — see issue comment"
  - name: "environments:failed"
    color: "B60205"
    description: "Could not create environments at destination (permissions/auth) — see issue comment"
  - name: "environments:rate-limit-deferred"
    color: "FBCA04"
    description: "GitHub API rate-limit too low to safely create environments; re-trigger via cmd:upsert-envs later"

upserted:
  # Short-form "done" labels stamped on success by each /upsert-* post-migrate command.
  # Scan an issue's `upserted:*` set to see at a glance which steps actually completed.
  # The detailed families (migration-fixes:*, custom-properties:*, secrets-recreate:*,
  # environments:*, branch-protection:dest-*, status:validate-*) remain the source of truth
  # for failure / partial / none / rate-limit-deferred states.
  - name: "upserted:teams"
    color: "0E8A16"
    description: "/upsert-teams succeeded: dst-team:* teams created/attached at destination"
  - name: "upserted:secrets"
    color: "0E8A16"
    description: "/upsert-secrets succeeded: at least one secret/variable stub created at destination"
  - name: "upserted:envs"
    color: "0E8A16"
    description: "/upsert-envs succeeded: at least one environment created at destination"
  - name: "upserted:protection"
    color: "0E8A16"
    description: "/upsert-protection succeeded: at least one branch protection rule applied at destination"
  - name: "upserted:properties"
    color: "0E8A16"
    description: "/upsert-properties succeeded: source custom properties applied at destination"
  - name: "upserted:validate"
    color: "0E8A16"
    description: "/upsert-validate passed: destination branch/tag/commit counts match the source"
  - name: "upserted:submodules"
    color: "0E8A16"
    description: "/upsert-fixes pushed submodule URL rewrites in amp/migration-fixes"
  - name: "upserted:workflows"
    color: "0E8A16"
    description: "/upsert-fixes pushed workflow `uses:` rewrites in amp/migration-fixes"
  - name: "upserted:codeowners"
    color: "0E8A16"
    description: "/upsert-fixes pushed CODEOWNERS team rewrites in amp/migration-fixes"

org_secrets_fyi:
  - name: "org-secrets:source-present"
    color: "C5DEF5"
    description: "Source org has Actions secrets/variables — FYI only, AMP does not write at org scope"

# Dynamic label families — values vary per repo/migration and are NOT enumerated here.
# Created on demand by `amp analyze` (defaults) and `amp bulk-assign` (auto-create).
#
#   namespace:<slug>     unified source grouping (ADO project / BB project / GL group / GH org)
#   src-org:<slug>       top-level source identifier (matters for ADO where org != project)
#   src-team:<slug>      source-side team/group attached to the repo (multi-valued)
#   dst-org:<slug>       target GitHub org — REQUIRED for /migrate
#   dst-team:<base>      base team name; /upsert-teams creates <base>-read/-write/-admin
#   dst-prefix:<slug>    prepended to source repo name to form target repo name
